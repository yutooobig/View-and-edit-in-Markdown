            // ==================== Git 文件系统 ====================
            async function initGitFs() {
                try {
                    const { default: LightningFS } = await import('https://esm.sh/@isomorphic-git/lightning-fs@1.3.0');
                    state.gitFs = new LightningFS('markdown-fs', { wipe: false });
                    state.gitModule = await import('https://esm.sh/isomorphic-git@1.25.10');
                    state.fsReady = true;
                    try {
                        await state.gitFs.promises.mkdir('/repo', { recursive: true });
                    } catch (e) {}
                    updateStatusBar();
                    showToast('Git 文件系统已就绪', 'success');
                    return true;
                } catch (e) {
                    console.error('Git FS 初始化失败:', e);
                    state.fsReady = false;
                    updateStatusBar();
                    showToast('Git 文件系统初始化失败，请检查网络后刷新重试', 'error');
                    return false;
                }
            }

            async function syncToGitFs(path, content) {
                if (!state.fsReady || !state.gitFs) return;
                try {
                    const fsPath = '/repo/' + path.replace(/^\/+/, '');
                    const dir = fsPath.substring(0, fsPath.lastIndexOf('/'));
                    if (dir) {
                        await state.gitFs.promises.mkdir(dir, { recursive: true });
                    }
                    await state.gitFs.promises.writeFile(fsPath, content, 'utf8');
                } catch (e) {
                    console.warn('同步到 Git FS 失败:', e);
                }
            }

            async function removeFromGitFs(path) {
                if (!state.fsReady || !state.gitFs) return;
                try {
                    const fsPath = '/repo/' + path.replace(/^\/+/, '');
                    await state.gitFs.promises.unlink(fsPath);
                } catch (e) {
                    console.warn('从 Git FS 删除失败:', e);
                }
            }

            async function syncAllToGitFs() {
                if (!state.fsReady || !state.gitFs) return;
                for (const [path, file] of Object.entries(state.files)) {
                    await syncToGitFs(path, file.content);
                }
            }

            async function gitPull() {
                if (!state.fsReady || !state.gitModule) {
                    showToast('Git 文件系统未就绪，请检查网络或刷新页面重试', 'error');
                    return;
                }
                if (!state.gitConfig || !state.gitConfig.url) {
                    showToast('请先在 Git 配置中填写远程仓库 URL', 'error');
                    return;
                }
                const config = state.gitConfig;
                showToast('正在拉取远程仓库...', 'info');
                try {
                    await syncAllToGitFs();
                    const result = await state.gitModule.pull({
                        fs: state.gitFs,
                        http: createHttpClient(config),
                        dir: '/repo',
                        ref: config.branch || 'main',
                        singleBranch: true,
                        author: { name: config.username || 'user', email: (config.username || 'user') + '@users.noreply.github.com' },
                    });
                    showToast(`拉取成功！${result.files && result.files.length ? '更新了 ' + result.files.length + ' 个文件' : '已是最新'}`, 'success');
                    await reloadFromGitFs();
                } catch (e) {
                    console.error('Pull 失败:', e);
                    showToast('拉取失败: ' + (e.message || '未知错误'), 'error');
                }
            }

            async function gitPush() {
                if (!state.fsReady || !state.gitModule) {
                    showToast('Git 文件系统未就绪，请检查网络或刷新页面重试', 'error');
                    return;
                }
                if (!state.gitConfig || !state.gitConfig.url) {
                    showToast('请先在 Git 配置中填写远程仓库 URL', 'error');
                    return;
                }
                const config = state.gitConfig;
                if (state.currentFile && state.isDirty) {
                    saveCurrentFile();
                }
                await syncAllToGitFs();
                showToast('正在提交并推送...', 'info');
                try {
                    const git = state.gitModule;
                    try {
                        await git.getConfig({ fs: state.gitFs, dir: '/repo', path: 'user.name' });
                    } catch (e) {
                        await git.init({ fs: state.gitFs, dir: '/repo', defaultBranch: config.branch || 'main' });
                        await git.setConfig({ fs: state.gitFs, dir: '/repo', path: 'user.name', value: config.username || 'markdown-user' });
                        await git.setConfig({ fs: state.gitFs, dir: '/repo', path: 'user.email', value: (config.username || 'markdown-user') + '@users.noreply.github.com' });
                    }
                    try {
                        const remotes = await git.listRemotes({ fs: state.gitFs, dir: '/repo' });
                        if (!remotes.some(r => r.url === config.url)) {
                            await git.addRemote({ fs: state.gitFs, dir: '/repo', remote: 'origin', url: config.url });
                        }
                    } catch (e) {
                        await git.addRemote({ fs: state.gitFs, dir: '/repo', remote: 'origin', url: config.url });
                    }
                    // 添加所有文件
                    const files = await state.gitFs.promises.readdir('/repo');
                    for (const file of files) {
                        if (file === '.git') continue;
                        const filePath = '/repo/' + file;
                        try {
                            const stat = await state.gitFs.promises.stat(filePath);
                            if (stat.isDirectory()) {
                                const subFiles = await getAllFiles(filePath);
                                for (const sf of subFiles) {
                                    await git.add({ fs: state.gitFs, dir: '/repo', filepath: sf.replace('/repo/', '') });
                                }
                            } else {
                                await git.add({ fs: state.gitFs, dir: '/repo', filepath: file });
                            }
                        } catch (e) {}
                    }
                    const commitMessage = 'Update Markdown files - ' + new Date().toLocaleString();
                    try {
                        await git.commit({
                            fs: state.gitFs,
                            dir: '/repo',
                            message: commitMessage,
                            author: { name: config.username || 'markdown-user', email: (config.username || 'markdown-user') + '@users.noreply.github.com' },
                        });
                    } catch (e) {
                        if (e.message && e.message.includes('No changes')) {
                            showToast('没有需要推送的更改', 'info');
                        } else {
                            throw e;
                        }
                    }
                    await git.push({
                        fs: state.gitFs,
                        http: createHttpClient(config),
                        dir: '/repo',
                        remote: 'origin',
                        ref: config.branch || 'main',
                        onAuth: () => ({ username: config.username, password: config.token }),
                        force: false,
                    });
                    showToast('推送成功！', 'success');
                } catch (e) {
                    console.error('Push 失败:', e);
                    showToast('推送失败: ' + (e.message || '未知错误'), 'error');
                }
            }

            function createHttpClient(config) {
                const headers = {};
                if (config.token) {
                    headers['Authorization'] = 'Bearer ' + config.token;
                }
                return {
                    request: async (req) => {
                        if (!req.url) req.url = config.url;
                        const res = await fetch(req.url, {
                            method: req.method || 'GET',
                            headers: { ...req.headers, ...headers, 'Accept': 'application/vnd.github+json', 'X-Git-Agent': 'markdown-manager' },
                            body: req.body,
                        });
                        return res;
                    }
                };
            }

            async function getAllFiles(dir) {
                const results = [];
                async function walk(d) {
                    const entries = await state.gitFs.promises.readdir(d);
                    for (const entry of entries) {
                        if (entry === '.git') continue;
                        const fullPath = d + '/' + entry;
                        const stat = await state.gitFs.promises.stat(fullPath);
                        if (stat.isDirectory()) {
                            await walk(fullPath);
                        } else {
                            results.push(fullPath);
                        }
                    }
                }
                await walk(dir);
                return results;
            }

            async function reloadFromGitFs() {
                if (!state.fsReady || !state.gitFs) return;
                try {
                    const files = await getAllFiles('/repo');
                    const newFiles = {};
                    for (const filePath of files) {
                        const relativePath = filePath.replace('/repo/', '');
                        const parts = relativePath.split('/');
                        if (parts.length === 2) {
                            const group = parts[0];
                            const name = parts[1];
                            if (name.endsWith('.md') || name.endsWith('.markdown') || name.endsWith('.txt')) {
                                const content = await state.gitFs.promises.readFile(filePath, 'utf8');
                                if (!state.groups.has(group)) {
                                    state.groups.add(group);
                                }
                                newFiles[relativePath] = {
                                    name: name,
                                    group: group,
                                    content: content,
                                    createdAt: state.files[relativePath]?.createdAt || new Date().toISOString(),
                                    updatedAt: new Date().toISOString(),
                                };
                            }
                        }
                    }
                    for (const [path, file] of Object.entries(newFiles)) {
                        if (!state.files[path] || state.files[path].content !== file.content) {
                            state.files[path] = file;
                        }
                    }
                    renderFileTree();
                    if (state.currentFile && state.files[state.currentFile]) {
                        setEditorContent(state.files[state.currentFile].content);
                        state.isDirty = false;
                    }
                    updateStatusBar();
                    showToast('文件已从仓库同步', 'success');
                } catch (e) {
                    console.warn('重新加载失败:', e);
                }
            }

            // ==================== 导出功能 ====================
            function exportSelectedFiles() {
                const selectedPaths = Array.from(state.selectedPaths);
                if (selectedPaths.length === 0) {
                    showToast('请先选择文件（点击文件或 Ctrl+点击多选）', 'error');
                    return;
                }
                if (selectedPaths.length === 1) {
                    const path = selectedPaths[0];
                    const file = state.files[path];
                    if (!file) return;
                    const blob = new Blob([file.content], { type: 'text/markdown' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = file.name;
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast(`已导出: ${file.name}`, 'success');
                } else {
                    exportFilesAsZip(selectedPaths);
                }
            }

            function exportAllFiles() {
                const allPaths = Object.keys(state.files);
                if (allPaths.length === 0) {
                    showToast('没有文件可导出', 'error');
                    return;
                }
                exportFilesAsZip(allPaths);
            }

            async function exportFilesAsZip(paths) {
                const zip = new JSZip();
                for (const path of paths) {
                    const file = state.files[path];
                    if (!file) continue;
                    const folder = zip.folder(file.group);
                    if (folder) {
                        folder.file(file.name, file.content);
                    }
                }
                const blob = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `markdown-export-${new Date().toISOString().slice(0,10)}.zip`;
                a.click();
                URL.revokeObjectURL(url);
                showToast(`已打包导出 ${paths.length} 个文件`, 'success');
            }

            // ==================== 侧边栏收起/展开 ====================
            function toggleSidebar() {
                state.sidebarCollapsed = !state.sidebarCollapsed;
                localStorage.setItem('md-sidebar-collapsed', state.sidebarCollapsed);
                applySidebarState();
            }

            function applySidebarState() {
                const sidebar = document.getElementById('sidebar');
                if (state.sidebarCollapsed) {
                    sidebar.classList.add('collapsed');
                } else {
                    sidebar.classList.remove('collapsed');
                }
                if (state.editor) {
                    setTimeout(() => state.editor.refresh(), 300);
                }
            }

            // ==================== 状态栏 ====================
            function updateStatusBar() {
                const fileEl = document.getElementById('statusFile');
                const charsEl = document.getElementById('statusChars');
                const gitEl = document.getElementById('statusGit');
                const searchEl = document.getElementById('statusSearch');
                if (state.currentFile && state.files[state.currentFile]) {
                    const file = state.files[state.currentFile];
                    fileEl.textContent = `📄 ${file.group}/${file.name}` + (state.isDirty ? ' ●' : '');
                } else {
                    fileEl.textContent = '未选择文件';
                }
                const content = state.editor ? state.editor.getValue() : '';
                charsEl.textContent = `${content.length} 字符`;
                if (!state.fsReady) {
                    gitEl.textContent = 'Git: 文件系统未就绪';
                } else if (state.gitConfig && state.gitConfig.url) {
                    gitEl.textContent = `Git: ${state.gitConfig.url.split('/').pop()}`;
                } else {
                    gitEl.textContent = 'Git: 未配置';
                }
                if (state.searchQuery) {
                    searchEl.textContent = `🔍 搜索: "${state.searchQuery}"`;
                } else {
                    searchEl.textContent = '';
                }
            }

            // ==================== 编辑器快捷键 ====================
            function toggleBold() {
                const editor = state.editor;
                if (!editor) return;
                const sel = editor.getSelection();
                if (sel) {
                    editor.replaceSelection(`**${sel}**`);
                } else {
                    const cursor = editor.getCursor();
                    editor.replaceRange('****', cursor);
                    editor.setCursor({ line: cursor.line, ch: cursor.ch + 2 });
                }
                editor.focus();
            }

            function toggleItalic() {
                const editor = state.editor;
                if (!editor) return;
                const sel = editor.getSelection();
                if (sel) {
                    editor.replaceSelection(`*${sel}*`);
                } else {
                    const cursor = editor.getCursor();
                    editor.replaceRange('**', cursor);
                    editor.setCursor({ line: cursor.line, ch: cursor.ch + 1 });
                }
                editor.focus();
            }

            // ==================== 视图模式 ====================
            function setViewMode(mode) {
                state.viewMode = mode;
                const editorPane = document.getElementById('editorPane');
                const previewPane = document.getElementById('previewPane');
                const tabs = document.querySelectorAll('.editor-tab');
                tabs.forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.mode === mode);
                });
                if (mode === 'edit') {
                    editorPane.style.display = 'flex';
                    previewPane.style.display = 'none';
                    editorPane.style.flex = '1';
                } else if (mode === 'preview') {
                    editorPane.style.display = 'none';
                    previewPane.style.display = 'flex';
                    previewPane.style.flex = '1';
                    updatePreview();
                } else {
                    editorPane.style.display = 'flex';
                    previewPane.style.display = 'flex';
                    editorPane.style.flex = '1';
                    previewPane.style.flex = '1';
                    updatePreview();
                }
                if (state.editor) {
                    state.editor.refresh();
                }
            }

            // ==================== 搜索功能 ====================
            function handleSearch(query) {
                state.searchQuery = query.trim().toLowerCase();
                if (!state.searchQuery) {
                    clearSearchHighlights();
                }
                renderFileTree();
                updateStatusBar();
                // 如果当前打开的文件，自动高亮搜索词
                if (state.currentFile && state.searchQuery) {
                    highlightSearchInEditor(state.searchQuery);
                } else if (state.currentFile && !state.searchQuery) {
                    clearSearchHighlights();
                }
            }

            // 在编辑器中高亮所有匹配并滚动到第一个匹配
            function highlightSearchInEditor(query) {
                clearSearchHighlights();
                if (!query || !state.editor) return;
                const cursor = state.editor.getSearchCursor(query, { line: 0, ch: 0 }, { caseFold: true });
                let firstMatch = null;
                while (cursor.findNext()) {
                    const from = cursor.from();
                    const to = cursor.to();
                    const marker = state.editor.markText(from, to, { className: 'cm-search-match' });
                    state.searchMarkers.push(marker);
                    if (!firstMatch) {
                        firstMatch = { from, to };
                    }
                }
                if (firstMatch) {
                    state.editor.setSelection(firstMatch.from, firstMatch.to);
                    state.editor.scrollIntoView(firstMatch.from, 50);
                }
            }

            function clearSearchHighlights() {
                state.searchMarkers.forEach(marker => marker.clear());
                state.searchMarkers = [];
            }

            // ==================== 初始化 ====================
            async function init() {
                state.hljs = window.hljs;
                initMarkdown();
                initEditor();
                applyTheme();
                setViewMode('split');
                applySidebarState();
                await initGitFs();

                const savedFiles = localStorage.getItem('md-files');
                if (savedFiles) {
                    try {
                        state.files = JSON.parse(savedFiles);
                        Object.values(state.files).forEach(f => {
                            if (f.group && !state.groups.has(f.group)) {
                                state.groups.add(f.group);
                            }
                        });
                    } catch (e) {}
                }
                const savedGroups = localStorage.getItem('md-groups');
                if (savedGroups) {
                    try {
                        const groups = JSON.parse(savedGroups);
                        groups.forEach(g => state.groups.add(g));
                    } catch (e) {}
                }
                if (!state.groups.has('默认')) state.groups.add('默认');

                renderFileTree();
                updateStatusBar();

                setInterval(() => {
                    localStorage.setItem('md-files', JSON.stringify(state.files));
                    localStorage.setItem('md-groups', JSON.stringify(Array.from(state.groups)));
                }, 5000);

                bindEvents();
                showToast('欢迎使用 Markdown 管理系统（增强版）！', 'info');
            }

            function bindEvents() {
                document.getElementById('btnNewFile').addEventListener('click', () => showNewFileModal());
                document.getElementById('btnNewGroup').addEventListener('click', () => showNewGroupModal());
                document.getElementById('btnUpload').addEventListener('click', () => document.getElementById('fileUploadInput').click());
                document.getElementById('btnSave').addEventListener('click', saveCurrentFile);
                document.getElementById('btnRename').addEventListener('click', () => {
                    if (state.currentFile) showRenameModal(state.currentFile);
                    else showToast('请先选择文件', 'error');
                });
                document.getElementById('btnDelete').addEventListener('click', () => {
                    if (state.currentFile) deleteFile(state.currentFile);
                    else showToast('请先选择文件', 'error');
                });
                document.getElementById('btnGitPull').addEventListener('click', gitPull);
                document.getElementById('btnGitPush').addEventListener('click', gitPush);
                document.getElementById('btnGitConfig').addEventListener('click', showGitConfigModal);
                document.getElementById('btnTheme').addEventListener('click', toggleTheme);
                document.getElementById('btnCollapseAll').addEventListener('click', () => {
                    state.collapsedGroups = new Set(Array.from(state.groups));
                    renderFileTree();
                });

                document.getElementById('btnUndo').addEventListener('click', () => {
                    if (state.editor) state.editor.undo();
                });
                document.getElementById('btnRedo').addEventListener('click', () => {
                    if (state.editor) state.editor.redo();
                });
                document.getElementById('btnExportSelected').addEventListener('click', exportSelectedFiles);
                document.getElementById('btnExportAll').addEventListener('click', exportAllFiles);
                document.getElementById('btnToggleSidebar').addEventListener('click', toggleSidebar);

                // 查找替换按钮
                document.getElementById('btnFindReplace').addEventListener('click', () => {
                    if (state.editor) state.editor.execCommand('replace');
                });

                document.getElementById('fileUploadInput').addEventListener('change', (e) => {
                    handleUpload(e.target.files);
                    e.target.value = '';
                });

                document.getElementById('searchInput').addEventListener('input', (e) => {
                    handleSearch(e.target.value);
                });

                document.querySelectorAll('.editor-tab').forEach(tab => {
                    tab.addEventListener('click', () => setViewMode(tab.dataset.mode));
                });

                // 拖放上传
                const dropZone = document.getElementById('dropZone');
                let dragCounter = 0;
                document.addEventListener('dragenter', (e) => { e.preventDefault(); dragCounter++; if (dragCounter === 1) dropZone.classList.add('active'); });
                document.addEventListener('dragleave', (e) => { e.preventDefault(); dragCounter--; if (dragCounter === 0) dropZone.classList.remove('active'); });
                document.addEventListener('dragover', (e) => e.preventDefault());
                document.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dragCounter = 0;
                    dropZone.classList.remove('active');
                    if (e.dataTransfer.files.length) handleUpload(e.dataTransfer.files);
                });

                // 键盘快捷键
                document.addEventListener('keydown', (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveCurrentFile(); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); showNewFileModal(); }
                });

                window.addEventListener('beforeunload', () => {
                    localStorage.setItem('md-files', JSON.stringify(state.files));
                    localStorage.setItem('md-groups', JSON.stringify(Array.from(state.groups)));
                    if (state.currentFile && state.editor && state.isDirty) {
                        state.files[state.currentFile].content = state.editor.getValue();
                        state.files[state.currentFile].updatedAt = new Date().toISOString();
                        localStorage.setItem('md-files', JSON.stringify(state.files));
                    }
                });

                state.editor.on('change', updateStatusBar);
            }

            function toggleTheme() {
                state.theme = state.theme === 'light' ? 'dark' : 'light';
                localStorage.setItem('md-theme', state.theme);
                applyTheme();
            }

            function applyTheme() {
                document.documentElement.setAttribute('data-theme', state.theme);
                if (state.editor) {
                    state.editor.setOption('theme', state.theme === 'dark' ? 'material-darker' : 'one-light');
                }
                const hljsDark = document.getElementById('hljs-dark');
                const hljsLight = document.getElementById('hljs-light');
                if (state.theme === 'dark') {
                    hljsDark.disabled = false;
                    hljsLight.disabled = true;
                } else {
                    hljsDark.disabled = true;
                    hljsLight.disabled = false;
                }
            }

            function handleUpload(files) {
                const group = state.currentGroup || '默认';
                let count = 0;
                const total = files.length;
                Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const content = e.target.result;
                        const name = file.name || 'uploaded.md';
                        const cleanName = name.endsWith('.md') || name.endsWith('.markdown') || name.endsWith('.txt') ? name : name + '.md';
                        const path = `${group}/${cleanName}`;
                        let finalPath = path;
                        let counter = 1;
                        while (state.files[finalPath]) {
                            const ext = cleanName.includes('.') ? '.' + cleanName.split('.').pop() : '';
                            const base = cleanName.replace(/\.[^.]+$/, '');
                            finalPath = `${group}/${base}_${counter}${ext}`;
                            counter++;
                        }
                        if (!state.groups.has(group)) state.groups.add(group);
                        state.files[finalPath] = {
                            name: finalPath.split('/').pop(),
                            group: group,
                            content: content,
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString(),
                        };
                        syncToGitFs(finalPath, content);
                        count++;
                        if (count === total) {
                            renderFileTree();
                            updateStatusBar();
                            showToast(`成功上传 ${count} 个文件`, 'success');
                        }
                    };
                    reader.readAsText(file);
                });
            }

            // 启动
            document.addEventListener('DOMContentLoaded', init);
            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                init();
            }

        })();
    </script>
</body>
</html>
