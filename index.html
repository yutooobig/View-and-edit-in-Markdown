<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 笔记 v1.1</title>

    <!-- CodeMirror 5 CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/one-light.min.css">

    <!-- highlight.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" id="hljs-dark">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css" id="hljs-light" disabled>

    <!-- 应用样式 -->
    <style>
        :root {
            --bg: #f5f7fa;
            --bg-sidebar: #ffffff;
            --bg-editor: #ffffff;
            --bg-preview: #ffffff;
            --bg-toolbar: #ffffff;
            --border: #e1e5eb;
            --text: #2c3e50;
            --text-secondary: #7f8c9b;
            --text-light: #95a5a6;
            --accent: #4a90d9;
            --accent-hover: #357abd;
            --accent-light: #e8f0fe;
            --danger: #e74c3c;
            --success: #27ae60;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.06);
            --radius: 8px;
            --radius-sm: 4px;
            --code-bg: #282c34;
            --code-text: #abb2bf;
            --transition: 0.2s ease;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        [data-theme="dark"] {
            --bg: #1a1d23;
            --bg-sidebar: #23272e;
            --bg-editor: #1e2127;
            --bg-preview: #1e2127;
            --bg-toolbar: #23272e;
            --border: #3a3f4a;
            --text: #d4d9e0;
            --text-secondary: #9aa4b0;
            --text-light: #6b7480;
            --accent: #5c9ce6;
            --accent-hover: #4a90d9;
            --accent-light: #2a3a4a;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background var(--transition), color var(--transition);
            font-size: 14px;
            line-height: 1.6;
        }

        /* 顶部工具栏 */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--bg-toolbar);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
            z-index: 100;
            box-shadow: var(--shadow-sm);
            transition: background var(--transition);
        }
        .toolbar .logo {
            font-weight: 700;
            font-size: 16px;
            color: var(--accent);
            margin-right: 12px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }
        .toolbar .logo svg {
            width: 22px;
            height: 22px;
        }
        .toolbar .sep {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
            flex-shrink: 0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            font-family: var(--font-sans);
            transition: all var(--transition);
            white-space: nowrap;
            user-select: none;
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .btn.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            color: #fff;
        }
        .btn.danger {
            color: var(--danger);
        }
        .btn.danger:hover {
            border-color: var(--danger);
            background: rgba(231, 76, 60, 0.1);
            color: var(--danger);
        }
        .btn.success {
            color: var(--success);
            border-color: var(--success);
        }
        .btn.success:hover {
            background: rgba(39, 174, 96, 0.1);
        }
        .btn.sm {
            padding: 4px 10px;
            font-size: 12px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* 主布局 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 0;
        }

        /* 侧边栏 - 文件树 */
        .sidebar {
            width: 280px;
            min-width: 200px;
            max-width: 400px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: background var(--transition);
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .sidebar-header .title {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }
        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px 6px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .file-tree::-webkit-scrollbar {
            width: 5px;
        }
        .file-tree::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
        .file-tree::-webkit-scrollbar-track {
            background: transparent;
        }

        /* 树形结构 */
        .tree-node {
            user-select: none;
        }
        .tree-node .node-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 13px;
            position: relative;
        }
        .tree-node .node-row:hover {
            background: var(--accent-light);
        }
        .tree-node .node-row.active {
            background: var(--accent);
            color: #fff;
        }
        .tree-node .node-row.active .node-icon {
            color: #fff;
        }
        .tree-node .node-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .tree-node .node-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 400;
        }
        .tree-node .node-badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 10px;
            background: var(--border);
            color: var(--text-secondary);
            flex-shrink: 0;
            font-weight: 600;
        }
        .tree-node .node-children {
            margin-left: 18px;
            border-left: 1px solid var(--border);
            padding-left: 4px;
        }
        .tree-node .node-children.collapsed {
            display: none;
        }
        .tree-node .toggle-arrow {
            font-size: 9px;
            transition: transform 0.2s ease;
            flex-shrink: 0;
            color: var(--text-light);
            width: 14px;
            text-align: center;
        }
        .tree-node .toggle-arrow.expanded {
            transform: rotate(90deg);
        }
        .tree-node .toggle-arrow.leaf {
            visibility: hidden;
        }

        /* 编辑器区域 */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }
        .editor-tabs {
            display: flex;
            align-items: center;
            padding: 0 12px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-toolbar);
            flex-shrink: 0;
            gap: 2px;
            min-height: 40px;
            transition: background var(--transition);
        }
        .editor-tab {
            padding: 8px 14px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            transition: all 0.15s ease;
            font-weight: 500;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .editor-tab:hover {
            color: var(--text);
        }
        .editor-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .editor-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            border-right: 1px solid var(--border);
        }
        .editor-pane:last-child {
            border-right: none;
        }
        .pane-header {
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg);
            transition: background var(--transition);
        }
        .CodeMirror {
            flex: 1;
            font-size: 14px;
            font-family: var(--font-mono);
            line-height: 1.7;
            height: 100%;
            background: var(--bg-editor);
            color: var(--text);
            transition: background var(--transition);
        }
        .preview-pane {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background: var(--bg-preview);
            transition: background var(--transition);
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .preview-pane::-webkit-scrollbar {
            width: 5px;
        }
        .preview-pane::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
        .preview-pane::-webkit-scrollbar-track {
            background: transparent;
        }

        /* Markdown 预览样式 */
        .markdown-body {
            font-size: 15px;
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto;
            color: var(--text);
        }
        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
            margin-top: 24px;
            margin-bottom: 12px;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text);
        }
        .markdown-body h1 {
            font-size: 2em;
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
        }
        .markdown-body h2 {
            font-size: 1.5em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }
        .markdown-body h3 {
            font-size: 1.25em;
        }
        .markdown-body p {
            margin: 10px 0;
        }
        .markdown-body a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px dashed var(--accent);
        }
        .markdown-body a:hover {
            border-bottom-style: solid;
        }
        .markdown-body ul,
        .markdown-body ol {
            padding-left: 24px;
            margin: 10px 0;
        }
        .markdown-body li {
            margin: 4px 0;
        }
        .markdown-body blockquote {
            border-left: 4px solid var(--accent);
            padding: 8px 16px;
            margin: 12px 0;
            background: var(--accent-light);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            color: var(--text-secondary);
        }
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
            font-size: 14px;
        }
        .markdown-body th,
        .markdown-body td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }
        .markdown-body th {
            background: var(--accent-light);
            font-weight: 600;
        }
        .markdown-body hr {
            border: none;
            border-top: 2px solid var(--border);
            margin: 20px 0;
        }
        .markdown-body img {
            max-width: 100%;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
        }
        .markdown-body code {
            font-family: var(--font-mono);
            background: var(--code-bg);
            color: #e06c75;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.9em;
        }
        .markdown-body pre {
            position: relative;
            margin: 14px 0;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .markdown-body pre code {
            display: block;
            padding: 16px 20px;
            overflow-x: auto;
            font-size: 13.5px;
            line-height: 1.7;
            color: var(--code-text);
            background: var(--code-bg);
            border-radius: 0;
            font-family: var(--font-mono);
        }
        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 10px;
            font-size: 11px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-sans);
            letter-spacing: 0.3px;
            z-index: 10;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.4);
        }
        .copy-btn.copied {
            background: rgba(39, 174, 96, 0.3);
            border-color: rgba(39, 174, 96, 0.5);
            color: #a3e4c1;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
            backdrop-filter: blur(4px);
        }
        .modal {
            background: var(--bg);
            border-radius: 12px;
            padding: 24px;
            width: 500px;
            max-width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            animation: slideUp 0.25s ease;
        }
        .modal h3 {
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal .form-group {
            margin-bottom: 14px;
        }
        .modal .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            transition: border-color 0.2s;
            outline: none;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.15);
        }
        .modal .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .modal .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Toast 通知 */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 18px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.2px;
        }
        .toast.success { background: #27ae60; color: #fff; }
        .toast.error { background: #e74c3c; color: #fff; }
        .toast.info { background: #4a90d9; color: #fff; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* 拖放上传区域 */
        .drop-zone {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(74, 144, 217, 0.15);
            border: 3px dashed var(--accent);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: var(--accent);
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
        .drop-zone.active { display: flex; pointer-events: all; }

        /* 搜索框 */
        .search-input {
            padding: 7px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            outline: none;
            width: 180px;
            transition: all 0.2s;
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.15);
            width: 220px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar { width: 200px; min-width: 150px; }
            .preview-pane { padding: 12px 14px; }
            .editor-content { flex-direction: column; }
            .editor-pane { border-right: none; border-bottom: 1px solid var(--border); flex: none; height: 50%; }
            .preview-pane { flex: 1; }
            .toolbar { padding: 6px 8px; gap: 4px; }
            .btn { padding: 5px 8px; font-size: 12px; }
            .btn .btn-text { display: none; }
            .search-input { width: 100px; font-size: 12px; }
            .search-input:focus { width: 130px; }
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text-light);
            text-align: center;
            gap: 8px;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 8px; opacity: 0.6; }
        .empty-state .text { font-size: 14px; font-weight: 500; }
        .empty-state .sub { font-size: 12px; opacity: 0.7; }

        /* 加载指示器 */
        .loading-spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 状态栏 */
        .status-bar {
            padding: 4px 16px;
            font-size: 11px;
            color: var(--text-light);
            border-top: 1px solid var(--border);
            background: var(--bg-toolbar);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            transition: background var(--transition);
            user-select: none;
        }
        .status-bar .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--success);
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

        /* 侧边栏收起动画 */
        .sidebar {
            transition: width 0.25s ease, min-width 0.25s ease, max-width 0.25s ease;
            overflow: hidden;
        }
        .sidebar.collapsed {
            width: 0 !important;
            min-width: 0 !important;
            max-width: 0 !important;
            border-right: none;
        }

        /* 工具栏按钮紧凑排列 */
        .toolbar .btn { margin: 2px 0; }

        /* 窄屏适配优化 */
        @media (max-width: 768px) {
            .editor-pane { min-height: 200px; }
            .preview-pane { min-height: 200px; }
            .toolbar { padding: 4px; }
            .btn .btn-text { display: none; }
        }

        /* 多选高亮 */
        .tree-node .node-row.selected {
            background: var(--accent-light);
            outline: 1px solid var(--accent);
        }
        .tree-node .node-row.selected.active {
            background: var(--accent);
            color: #fff;
        }

        /* 搜索高亮 */
        .cm-search-match {
            background: #ffee00;
            color: #000;
            border-radius: 2px;
        }
        .cm-search-match-selected {
            background: #ff9632;
            color: #000;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- 拖放上传遮罩 -->
    <div class="drop-zone" id="dropZone">

    <!-- 引入脚本 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
    <!-- 引入 CodeMirror 搜索插件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/go.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/rust.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>

    <script>
        (function() {
            'use strict';

            // ==================== 全局状态 ====================
            const state = {
                files: {}, // { path: { name, group, content, createdAt, updatedAt } }
                groups: new Set(['默认']),
                currentFile: null,
                currentGroup: '默认',
                editor: null,
                md: null,
                hljs: null,
                theme: localStorage.getItem('md-theme') || 'light',
                gitConfig: JSON.parse(localStorage.getItem('md-git-config') || 'null'),
                gitFs: null,
                gitModule: null,
                fsReady: false,
                viewMode: 'split',
                searchQuery: '',
                collapsedGroups: new Set(),
                isDirty: false,
                lastSavedContent: '',
                selectedPaths: new Set(), // 多选文件路径
                sidebarCollapsed: localStorage.getItem('md-sidebar-collapsed') === 'true',
                searchMarkers: [], // 存储当前高亮的标记
            };

            // ==================== Toast 通知 ====================
            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icons = { success: '✅', error: '❌', info: 'ℹ️' };
                toast.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 2500);
            }

            // ==================== 初始化 markdown-it ====================
            function initMarkdown() {
                state.md = new markdownit({
                    html: true,
                    linkify: true,
                    typographer: true,
                    highlight: function(str, lang) {
                        if (lang && state.hljs && state.hljs.getLanguage(lang)) {
                            try {
                                return `<pre class="hljs"><code>${state.hljs.highlight(str, { language: lang, ignoreIllegals: true }).value}</code></pre>`;
                            } catch (e) {}
                        }
                        return `<pre class="hljs"><code>${state.md.utils.escapeHtml(str)}</code></pre>`;
                    }
                });
                const defaultFence = state.md.renderer.rules.fence;
                state.md.renderer.rules.fence = function(tokens, idx, options, env, self) {
                    const token = tokens[idx];
                    const content = token.content;
                    const lang = token.info ? token.info.trim().split(/\s+/g)[0] : '';
                    const highlighted = state.hljs && lang && state.hljs.getLanguage(lang) ?
                        state.hljs.highlight(content, { language: lang, ignoreIllegals: true }).value :
                        state.md.utils.escapeHtml(content);
                    const langLabel = lang || 'text';
                    return `<div class="code-block-wrapper" style="position:relative;">` +
                        `<button class="copy-btn" data-code="${state.md.utils.escapeHtml(content)}" title="复制代码">📋 复制</button>` +
                        `<pre class="hljs"><code class="language-${langLabel}">${highlighted}</code></pre></div>`;
                };
                return state.md;
            }

            // ==================== 初始化 CodeMirror ====================
            function initEditor() {
                const textarea = document.getElementById('codeEditor');
                state.editor = CodeMirror.fromTextArea(textarea, {
                    mode: 'markdown',
                    theme: state.theme === 'dark' ? 'material-darker' : 'one-light',
                    lineNumbers: true,
                    lineWrapping: true,
                    autoCloseBrackets: true,
                    matchBrackets: true,
                    styleActiveLine: true,
                    tabSize: 2,
                    indentUnit: 2,
                    extraKeys: {
                        'Ctrl-S': function() { saveCurrentFile(); },
                        'Cmd-S': function() { saveCurrentFile(); },
                        'Ctrl-B': function() { toggleBold(); },
                        'Cmd-B': function() { toggleBold(); },
                        'Ctrl-I': function() { toggleItalic(); },
                        'Cmd-I': function() { toggleItalic(); },
                        'Ctrl-Z': function() { state.editor.undo(); },
                        'Cmd-Z': function() { state.editor.undo(); },
                        'Ctrl-Y': function() { state.editor.redo(); },
                        'Cmd-Y': function() { state.editor.redo(); },
                        'Ctrl-F': function() { state.editor.execCommand('find'); },
                        'Cmd-F': function() { state.editor.execCommand('find'); },
                        'Ctrl-H': function() { state.editor.execCommand('replace'); },
                        'Cmd-H': function() { state.editor.execCommand('replace'); },
                    }
                });
                state.editor.on('change', function() {
                    state.isDirty = true;
                    updateStatusBar();
                    debouncedPreview();
                });
                return state.editor;
            }

            let previewTimeout = null;
            function debouncedPreview() {
                clearTimeout(previewTimeout);
                previewTimeout = setTimeout(() => updatePreview(), 300);
            }

            function updatePreview() {
                const content = state.editor ? state.editor.getValue() : '';
                const previewEl = document.getElementById('previewContent');
                if (state.md && previewEl) {
                    previewEl.innerHTML = state.md.render(content);
                    previewEl.querySelectorAll('.copy-btn').forEach(btn => {
                        btn.addEventListener('click', function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            const code = this.getAttribute('data-code');
                            copyToClipboard(decodeHtmlEntities(code));
                            this.textContent = '✅ 已复制';
                            this.classList.add('copied');
                            setTimeout(() => {
                                this.textContent = '📋 复制';
                                this.classList.remove('copied');
                            }, 1500);
                        });
                    });
                }
            }

            function decodeHtmlEntities(text) {
                const textarea = document.createElement('textarea');
                textarea.innerHTML = text;
                return textarea.value;
            }

            async function copyToClipboard(text) {
                try {
                    await navigator.clipboard.writeText(text);
                    showToast('已复制到剪贴板', 'success');
                } catch (e) {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    textarea.remove();
                    showToast('已复制到剪贴板', 'success');
                }
            }

            // ==================== 文件树渲染（支持多选） ====================
            function renderFileTree() {
                const treeEl = document.getElementById('fileTree');
                treeEl.innerHTML = '';

                if (Object.keys(state.files).length === 0 && state.groups.size === 1 && state.groups.has('默认')) {
                    treeEl.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">📂</div>
                            <div class="text">暂无文件</div>
                            <div class="sub">点击上方「新建」开始</div>
                        </div>`;
                    return;
                }

                const groups = Array.from(state.groups).sort();

                groups.forEach(group => {
                    const groupFiles = Object.entries(state.files)
                        .filter(([path, f]) => f.group === group)
                        .sort((a, b) => a[1].name.localeCompare(b[1].name));

                    const groupNode = document.createElement('div');
                    groupNode.className = 'tree-node';
                    groupNode.dataset.group = group;

                    const isCollapsed = state.collapsedGroups.has(group);
                    const nodeRow = document.createElement('div');
                    nodeRow.className = 'node-row' + (state.currentGroup === group && !state.currentFile ? ' active' : '');
                    nodeRow.innerHTML = `
                        <span class="toggle-arrow ${isCollapsed ? '' : 'expanded'}">▶</span>
                        <span class="node-icon">📁</span>
                        <span class="node-name">${escapeHtml(group)}</span>
                        <span class="node-badge">${groupFiles.length}</span>
                    `;
                    nodeRow.addEventListener('click', () => {
                        if (state.collapsedGroups.has(group)) {
                            state.collapsedGroups.delete(group);
                        } else {
                            state.collapsedGroups.add(group);
                        }
                        state.currentGroup = group;
                        state.currentFile = null;
                        renderFileTree();
                        setEditorContent('');
                        updateStatusBar();
                    });
                    nodeRow.addEventListener('dblclick', () => showNewFileModal(group));
                    groupNode.appendChild(nodeRow);

                    if (!isCollapsed && groupFiles.length > 0) {
                        const childrenDiv = document.createElement('div');
                        childrenDiv.className = 'node-children';
                        groupFiles.forEach(([path, file]) => {
                            const fileNode = document.createElement('div');
                            fileNode.className = 'tree-node';
                            const fileRow = document.createElement('div');
                            const isSelected = state.selectedPaths.has(path);
                            const isActive = state.currentFile === path;
                            fileRow.className = 'node-row' + (isActive ? ' active' : '') + (isSelected ? ' selected' : '');

                            // 如果搜索关键词存在，计算匹配次数并显示在badge
                            let matchCount = 0;
                            if (state.searchQuery) {
                                const query = state.searchQuery.toLowerCase();
                                const content = file.content.toLowerCase();
                                let idx = content.indexOf(query);
                                while (idx !== -1) {
                                    matchCount++;
                                    idx = content.indexOf(query, idx + query.length);
                                }
                            }
                            const badgeHtml = matchCount > 0 ? `<span class="node-badge" style="background:var(--accent-light);color:var(--accent)">${matchCount}</span>` : '';

                            fileRow.innerHTML = `
                                <span class="toggle-arrow leaf">▶</span>
                                <span class="node-icon">📄</span>
                                <span class="node-name">${escapeHtml(file.name)}</span>
                                ${badgeHtml}
                            `;
                            fileRow.addEventListener('click', (e) => {
                                e.stopPropagation();
                                if (e.ctrlKey || e.metaKey) {
                                    if (state.selectedPaths.has(path)) {
                                        state.selectedPaths.delete(path);
                                    } else {
                                        state.selectedPaths.add(path);
                                    }
                                    renderFileTree();
                                } else {
                                    state.selectedPaths.clear();
                                    state.selectedPaths.add(path);
                                    openFile(path);
                                }
                            });
                            fileRow.addEventListener('dblclick', (e) => {
                                e.stopPropagation();
                                openFile(path);
                                showRenameModal(path);
                            });
                            fileNode.appendChild(fileRow);
                            childrenDiv.appendChild(fileNode);
                        });
                        groupNode.appendChild(childrenDiv);
                    }

                    treeEl.appendChild(groupNode);
                });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ==================== 文件操作 ====================
            function openFile(path) {
                const file = state.files[path];
                if (!file) return;
                state.currentFile = path;
                state.currentGroup = file.group;
                state.lastSavedContent = file.content;
                setEditorContent(file.content);
                state.isDirty = false;
                if (!state.selectedPaths.has(path)) {
                    state.selectedPaths.clear();
                    state.selectedPaths.add(path);
                }
                renderFileTree();
                updateStatusBar();
                showToast(`已打开: ${file.name}`, 'info');

                // 如果有搜索关键词，自动在编辑器中高亮并滚动到第一个匹配
                if (state.searchQuery) {
                    highlightSearchInEditor(state.searchQuery);
                }
            }

            function setEditorContent(content) {
                if (state.editor) {
                    state.editor.setValue(content || '');
                    state.editor.clearHistory();
                }
                updatePreview();
                // 清除之前的搜索高亮
                clearSearchHighlights();
            }

            function saveCurrentFile() {
                if (!state.currentFile) {
                    showToast('请先选择或创建一个文件', 'error');
                    return;
                }
                const file = state.files[state.currentFile];
                const content = state.editor.getValue();
                file.content = content;
                file.updatedAt = new Date().toISOString();
                state.lastSavedContent = content;
                state.isDirty = false;
                updateStatusBar();
                showToast(`已保存: ${file.name}`, 'success');
                syncToGitFs(state.currentFile, content);
            }

            function createFile(group, name) {
                const cleanName = name.endsWith('.md') ? name : name + '.md';
                const path = `${group}/${cleanName}`;
                if (state.files[path]) {
                    showToast('同名文件已存在', 'error');
                    return false;
                }
                if (!state.groups.has(group)) {
                    state.groups.add(group);
                }
                state.files[path] = {
                    name: cleanName,
                    group: group,
                    content: '# ' + cleanName.replace('.md', '') + '\n\n开始编写内容...\n',
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString(),
                };
                state.currentFile = path;
                state.currentGroup = group;
                state.lastSavedContent = state.files[path].content;
                setEditorContent(state.files[path].content);
                state.isDirty = false;
                state.selectedPaths.clear();
                state.selectedPaths.add(path);
                renderFileTree();
                updateStatusBar();
                showToast(`已创建: ${cleanName}`, 'success');
                syncToGitFs(path, state.files[path].content);
                return true;
            }

            function deleteFile(path) {
                if (!path || !state.files[path]) return;
                const file = state.files[path];
                if (!confirm(`确定删除文件「${file.name}」吗？此操作不可撤销。`)) return;
                delete state.files[path];
                if (state.currentFile === path) {
                    state.currentFile = null;
                    setEditorContent('');
                }
                state.selectedPaths.delete(path);
                removeFromGitFs(path);
                renderFileTree();
                updateStatusBar();
                showToast(`已删除: ${file.name}`, 'info');
            }

            function renameFile(path, newName) {
                const file = state.files[path];
                if (!file) return;
                const cleanName = newName.endsWith('.md') ? newName : newName + '.md';
                const newPath = `${file.group}/${cleanName}`;
                if (newPath === path) return;
                if (state.files[newPath]) {
                    showToast('同名文件已存在', 'error');
                    return;
                }
                removeFromGitFs(path);
                file.name = cleanName;
                file.updatedAt = new Date().toISOString();
                state.files[newPath] = file;
                delete state.files[path];
                if (state.currentFile === path) {
                    state.currentFile = newPath;
                }
                if (state.selectedPaths.has(path)) {
                    state.selectedPaths.delete(path);
                    state.selectedPaths.add(newPath);
                }
                syncToGitFs(newPath, file.content);
                renderFileTree();
                updateStatusBar();
                showToast(`已重命名为: ${cleanName}`, 'success');
            }

            function moveFileToGroup(path, newGroup) {
                const file = state.files[path];
                if (!file || file.group === newGroup) return;
                if (!state.groups.has(newGroup)) {
                    state.groups.add(newGroup);
                }
                const newPath = `${newGroup}/${file.name}`;
                if (state.files[newPath]) {
                    showToast('目标分组有同名文件', 'error');
                    return;
                }
                removeFromGitFs(path);
                file.group = newGroup;
                file.updatedAt = new Date().toISOString();
                state.files[newPath] = file;
                delete state.files[path];
                if (state.currentFile === path) {
                    state.currentFile = newPath;
                    state.currentGroup = newGroup;
                }
                if (state.selectedPaths.has(path)) {
                    state.selectedPaths.delete(path);
                    state.selectedPaths.add(newPath);
                }
                syncToGitFs(newPath, file.content);
                renderFileTree();
                updateStatusBar();
                showToast(`已移动到: ${newGroup}`, 'success');
            }

            function createGroup(name) {
                if (!name.trim()) return;
                if (state.groups.has(name)) {
                    showToast('分组已存在', 'error');
                    return;
                }
                state.groups.add(name);
                state.collapsedGroups.delete(name);
                renderFileTree();
                showToast(`已创建分组: ${name}`, 'success');
            }

            function deleteGroup(name) {
                if (!state.groups.has(name)) return;
                const filesInGroup = Object.entries(state.files).filter(([p, f]) => f.group === name);
                if (filesInGroup.length > 0) {
                    if (!confirm(`分组「${name}」中有 ${filesInGroup.length} 个文件，确定删除并移动文件到「默认」？`)) return;
                    filesInGroup.forEach(([path, file]) => {
                        const newPath = `默认/${file.name}`;
                        let finalPath = newPath;
                        let counter = 1;
                        while (state.files[finalPath]) {
                            const ext = file.name.includes('.') ? '.' + file.name.split('.').pop() : '';
                            const baseName = file.name.replace(ext, '');
                            finalPath = `默认/${baseName}_${counter}${ext}`;
                            counter++;
                        }
                        file.group = '默认';
                        file.name = finalPath.split('/').pop();
                        file.updatedAt = new Date().toISOString();
                        state.files[finalPath] = file;
                        delete state.files[path];
                        if (state.currentFile === path) {
                            state.currentFile = finalPath;
                            state.currentGroup = '默认';
                        }
                        if (state.selectedPaths.has(path)) {
                            state.selectedPaths.delete(path);
                            state.selectedPaths.add(finalPath);
                        }
                        syncToGitFs(finalPath, file.content);
                        removeFromGitFs(path);
                    });
                }
                state.groups.delete(name);
                state.collapsedGroups.delete(name);
                if (state.currentGroup === name) {
                    state.currentGroup = '默认';
                    state.currentFile = null;
                    setEditorContent('');
                }
                renderFileTree();
                updateStatusBar();
                showToast(`已删除分组: ${name}`, 'info');
            }

            // ==================== 模态框 ====================
            function showModal(html, onOk) {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                    <div class="modal">
                        ${html}
                        <div class="modal-actions">
                            <button class="btn" id="modalCancel">取消</button>
                            <button class="btn primary" id="modalOk">确定</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);
                overlay.querySelector('#modalCancel').addEventListener('click', () => overlay.remove());
                overlay.querySelector('#modalOk').addEventListener('click', () => {
                    const result = onOk(overlay);
                    if (result !== false) overlay.remove();
                });
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) overlay.remove();
                });
                return overlay;
            }
